name: Public repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/dashboard.py --check
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check -p godhand-lab --features viewer --locked
