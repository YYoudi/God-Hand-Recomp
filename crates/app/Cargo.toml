[package]
name = "godhand-lab"
default-run = "godhand-lab"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
viewer = ["dep:bevy"]

[dependencies]
godhand-disc.workspace = true
godhand-engine.workspace = true
bevy = { workspace = true, optional = true }


[[bin]]
name = "godhand-lab"
path = "src/main.rs"

[[bin]]
name = "godhand-alpha-check"
path = "src/bin/alpha_check.rs"
required-features = ["viewer"]

[[bin]]
name = "godhand-alpha-inspect"
path = "src/bin/alpha_inspect.rs"

[[bin]]
name = "godhand-static-control"
path = "src/bin/static_control.rs"
required-features = ["viewer"]
